name: Build Reno9 Pro Plus 270

# 目标：用 TNTyep520/kernel_reno9_sm8475_bundle (main, 5.10.270) 编出 Image，
#       并对「能否连带编出 OPPO 模块」做一次真实可行性探测。
#
# ===== 历史（按 run 累积，别删）=====
# run #1  42757943489 failure: scripts/*.sh 丢 exec 位
#           → ../scripts/as-version.sh: Permission denied
#           → Kconfig.include:47 Sorry, this assembler is not supported
#           → gki_defconfig Error 2
#           已修：Fetch 阶段 find + chmod +x
# run #2  42765510103 failure: Build kernel 编译全平台 DTB
#           → arch/arm64/boot/dts/allwinner/sun50i-a64.dtsi:6:10
#             fatal error: 'dt-bindings/clock/sun50i-a64-ccu.h' file not found
#           → Makefile:1498: dtbs Error 2
#           原因：arm64 的 all: 目标含 dtbs，make 不带目标会把所有厂商板卡 DTB 都编一遍。
#                 GKI 只要 Image，不需要 DTB。已修：显式指定 Image 目标。
#
# ===== 已知结构性问题（2026-11-10 查明，务必先读）=====
#   该 bundle 是 zip 上传的仓库，除了 exec 位，**符号链接也被压成了普通文本文件**：
#     官方 oppo-source 仓库： kernel_platform/build/build.config = symlink → ../build.config
#     本 bundle：            kernel_platform/build/build.config = 15 字节普通文件，内容字面 "../build.config"
#   而 OPPO 整套构建链依赖符号链接（kernel/oplus_cpu → vendor/oplus/kernel/cpu 等）。
#   ⇒ 本工作流新增「还原符号链接」步骤（只在目标真实存在时才转，宁可不改也不误改）。
#
#   更根本：bundle 的 kernel_common 是【纯净 ACK 270 树】（全树 0 处 oplus 引用），
#   而 OPPO 模块源码长在【带 OPPO hook 的 236 common 树】上。OPPO 从未给 sm8475 出过
#   270 common 树 ⇒ 想让 236 模块源码在 270 上全量编过，缺的是内核侧的 hook 移植，
#   不是 CI 配置。故本工作流只做「探测」，不承诺模块能编成。
#
# ===== 产物定位（别误用）=====
#   Image 即使编过，也【不能】配设备上 377 个 5.10.236 预编译 .ko：
#   kernel/module.c 的 same_magic() 在 MODVERSIONS=y 且模块带 CRC 时跳过版本后缀比对，
#   真正的关卡是符号 CRC，而 270 与 236 的导出符号/CRC 必然不同。
#   ⇒ 本工作流产出仅用于：确认 270 树能否编过、模块差多少、拿 Image 做对比分析。

on:
  workflow_dispatch:
    inputs:
      KERNEL_SUFFIX:
        description: 'LOCALVERSION 后缀'
        type: string
        default: '-android12-9-o-g-pgw110-270'
      PROBE_MODULES:
        description: '是否执行模块可行性探测（只探测，失败不阻断）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      BUNDLE_REPO: 'https://github.com/TNTyep520/kernel_reno9_sm8475_bundle'
      BUNDLE_BRANCH: 'main'
      CLANG_REPO: 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b'
      CLANG_BRANCH: 'lineage-20.0'
      CLANG_DIR: '/home/runner/clang-r416183b'
      LV: ${{ github.event.inputs.KERNEL_SUFFIX || '-android12-9-o-g-pgw110-270' }}
      CCACHE_DIR: '/home/runner/.ccache_pgw110_270'
      CCACHE_MAXSIZE: '6G'
      CCACHE_COMPILERCHECK: 'content'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_BASEDIR: '/home/runner/work'

    steps:
      - name: Checkout (Patches/)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            python3 git curl wget ccache rsync unzip zip cpio kmod \
            zlib1g-dev libxml2-utils dwarves lz4 device-tree-compiler
          gcc --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-pgw110-270-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pgw110-270-

      - name: Fetch clang r416183b
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" "$CLANG_DIR"
          "$CLANG_DIR/bin/clang" --version

      - name: Fetch bundle (5.10.270)
        run: |
          set -e
          rm -rf src kernel_platform vendor
          git clone --depth=1 -b "$BUNDLE_BRANCH" "$BUNDLE_REPO" src
          echo "HEAD: $(git -C src rev-parse --short HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' src/kernel_common/Makefile

          mkdir -p kernel_platform
          mv src/kernel_common kernel_platform/common
          for d in build oplus qcom; do
            if [ -d "src/kernel_vendor/kernel_platform/$d" ]; then
              mv "src/kernel_vendor/kernel_platform/$d" "kernel_platform/$d"
            fi
          done
          mv src/kernel_vendor/vendor ./vendor
          rm -rf src

          # 注意：不能清空 scripts/setlocalversion —— CONFIG_LOCALVERSION 正是它拼上去的

          echo "=== 还原被 zip 压平的符号链接 ==="
          # 判据极保守：普通文件 + 无换行 + 无空格 + <=200B + 内容是相对路径 + 目标真实存在。
          # 任一条件不满足就不动（宁可漏还原，不可误改真文件）。
          python3 - <<'PY'
          import os
          fixed = kept = err = 0
          for dirpath, dirnames, filenames in os.walk('.'):
              if '.git' in dirpath.split(os.sep):
                  continue
              for fn in filenames:
                  p = os.path.join(dirpath, fn)
                  try:
                      if os.path.islink(p):
                          continue
                      if os.lstat(p).st_size > 200:
                          continue
                      with open(p, 'rb') as f:
                          raw = f.read()
                  except OSError:
                      continue
                  if not raw or b'\n' in raw or b'\r' in raw or b'\x00' in raw:
                      continue
                  try:
                      txt = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if not txt or ' ' in txt or '/' not in txt:
                      continue
                  tgt = os.path.normpath(os.path.join(dirpath, txt))
                  if tgt == os.path.normpath(p) or not os.path.exists(tgt):
                      kept += 1
                      continue
                  # 先建临时链接再原子替换：任何一步失败都不会把原文件删没了
                  tmp = p + '.symtmp'
                  try:
                      if os.path.lexists(tmp):
                          os.remove(tmp)
                      os.symlink(os.path.relpath(tgt, dirpath), tmp)
                      os.replace(tmp, p)
                      fixed += 1
                  except OSError:
                      err += 1
                      try:
                          if os.path.lexists(tmp):
                              os.remove(tmp)
                      except OSError:
                          pass
          print('symlinks restored: %d   (目标不存在跳过: %d, 还原失败: %d)' % (fixed, kept, err))
          PY

          echo "=== 抽查 build.config ==="
          ls -l kernel_platform/build/build.config || true
          test -L kernel_platform/build/build.config && echo "  OK   已是符号链接" || echo "  WARN 仍是普通文件"

          echo "=== 还原 exec 位 ==="
          find kernel_platform -type f -name '*.sh' -print0 | xargs -0 -r chmod +x
          find kernel_platform/common/scripts -maxdepth 3 -type f ! -name '*.*' -print0 | xargs -0 -r chmod +x
          sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki || true
          echo "--- 布局 ---"
          ls kernel_platform
          ls vendor

      - name: Scan leftover merge conflict markers
        run: |
          # bundle 是「半合并」状态提交的：merge 分支 UP270 后冲突标记没清。
          # 实例（run 42775000831）：kernel_common/include/trace/hooks/binder.h 第 158-159 行残留
          #     =======
          #     >>>>>>> UP270
          #   → clang: include/trace/hooks/binder.h:158:1: error: expected identifier or '('
          #   → 错误恢复把紧随其后的 static HLIST_HEAD(binder_deferred_list) 整个吞掉
          #   → binder.c:6323 use of undeclared identifier 'binder_deferred_list'
          #   → drivers/android/binder.o + binder_alloc.o 全灭，drivers 目录 Error 2
          #
          # 本步策略：
          #   · 只机械处理「======= 紧接 >>>>>>>」且没有 <<<<<<< 开标记的纯残留（另一侧为空，
          #     等价于取当前这一侧，语义无损）→ 删掉这两行；
          #   · 任何真正的三方冲突（带 <<<<<<< 或中间有内容）一律列出：
          #       - 出现在源码/构建文件里 → 阻断（exit 1），绝不猜；
          #       - 只出现在文档里（.txt/.rst/.md…）→ 仅记录 INFO，不阻断（不参与编译）。
          #   · 纯 ======= 的文档标题下划线不在扫描范围内（必须同时含 <<<<<<< 或 >>>>>>> 才算）。
          python3 - <<'PY'
          import os, sys
          CODE_EXT = {'.c', '.h', '.cc', '.cpp', '.cxx', '.S', '.s', '.rs',
                      '.dts', '.dtsi', '.mk', '.bp', '.sh', '.py', '.yaml', '.yml',
                      '.config', '.kconfig', '.inc', '.lds', '.ld'}
          CODE_NAME = {'Makefile', 'Kbuild', 'Kconfig', 'Android.mk', 'Android.bp',
                       'BUILD.bazel', 'CMakeLists.txt'}

          def is_code(p):
              b = os.path.basename(p)
              if b in CODE_NAME:
                  return True
              return os.path.splitext(b)[1].lower() in CODE_EXT

          auto = {}
          hard = {}
          info = {}
          for dp, dns, fns in os.walk('.'):
              if '.git' in dp.split(os.sep):
                  continue
              for fn in fns:
                  p = os.path.join(dp, fn)
                  try:
                      if os.path.islink(p) or os.lstat(p).st_size > 8 * 1024 * 1024:
                          continue
                      with open(p, 'rb') as f:
                          raw = f.read()
                  except OSError:
                      continue
                  # 只有同时含 <<<<<<< 或 >>>>>>> 才算疑似冲突文件；
                  # 纯 ======= 的行多半是文档里的标题下划线，不能误判。
                  if b'<<<<<<<' not in raw and b'>>>>>>>' not in raw:
                      continue
                  try:
                      with open(p, 'r', encoding='utf-8', newline='') as f:
                          lines = f.readlines()
                  except (OSError, UnicodeDecodeError):
                      continue
                  ids = [i for i, l in enumerate(lines)
                         if l.startswith(('<<<<<<<', '|||||||', '=======', '>>>>>>>'))]
                  if not ids:
                      continue
                  dels = set()
                  bad = False
                  for n, i in enumerate(ids):
                      l = lines[i]
                      prev = lines[ids[n - 1]] if n > 0 else ''
                      nxt = lines[ids[n + 1]] if n + 1 < len(ids) else ''
                      if l.startswith('<<<<<<<'):
                          bad = True
                      elif l.startswith('>>>>>>>'):
                          if not prev.startswith('======='):
                              bad = True
                      elif l.startswith('======='):
                          if prev.startswith('<<<<<<<') or nxt.startswith('<<<<<<<'):
                              bad = True
                          elif nxt.startswith('>>>>>>>'):
                              dels.add(i)
                              dels.add(ids[n + 1])
                          else:
                              bad = True
                  code = is_code(p)
                  if bad:
                      (hard if code else info).setdefault(p, []).extend(
                          i + 1 for i in ids if i not in dels)
                      continue
                  if not dels:
                      (hard if code else info).setdefault(p, []).extend(i + 1 for i in ids)
                      continue
                  if not code:
                      # 文档里的残留标记不影响编译，只记录不修改
                      info[p] = [i + 1 for i in dels]
                      continue
                  kept = [l for i, l in enumerate(lines) if i not in dels]
                  with open(p, 'w', encoding='utf-8', newline='') as f:
                      f.writelines(kept)
                  auto[p] = [i + 1 for i in dels]

          print('=== 自动清理的纯残留标记（源码文件）===')
          for p, ns in auto.items():
              print('  FIX  %s  行 %s' % (p, ','.join(map(str, ns))))
          if not auto:
              print('  （无）')
          print('=== 阻断：源码文件里的真冲突 ===')
          for p, ns in hard.items():
              print('  HARD %s  行 %s' % (p, ','.join(map(str, sorted(ns)))))
          if not hard:
              print('  （无）')
          print('=== 仅记录：文档里的残留标记（不阻断）===')
          for p, ns in info.items():
              print('  INFO %s  行 %s' % (p, ','.join(map(str, sorted(ns)))))
          if not info:
              print('  （无）')
          if hard:
              print('::error::源码文件存在 %d 处真冲突，需人工判断后再编' % len(hard))
              sys.exit(1)
          print('OK: 清理 %d 个源码文件，文档残留 %d 处（已忽略）' % (len(auto), len(info)))
          PY


      - name: Repair half-applied f2fs lookup_mode patch
        run: |
          # bundle 的坏合并在 f2fs 上留下的第二处伤（run 42951874514）：
          #   fs/f2fs/f2fs.h:5078  enum f2fs_lookup_mode { LOOKUP_PERF/COMPAT/AUTO };
          #   fs/f2fs/f2fs.h:5083  一个孤立 '}'（原本是某个 static inline 块的结尾）
          #   但 f2fs_get_lookup_mode() / f2fs_set_lookup_mode() 全树 0 处定义，
          #   而 dir.c:23、super.c:1279/2061 都在调用；struct f2fs_sb_info 里也没有 lookup_mode 字段。
          #   ⇒ 合并时把「字段 + 两个 accessor」整段丢了。
          #
          # 本步只做最小可编修复：
          #   ① 删掉孤立 '}'；
          #   ② 在枚举后补两个 accessor：get 恒返回 LOOKUP_AUTO（上游默认行为），
          #      set 为空操作 ⇒ 挂载参数 lookup_mode= 会被静默忽略，按 auto 走。
          # ⚠️ 这是降级实现，不是 OPPO 原特性。仅用于让 270 树编过做对比，
          #    产物不可当作功能等价的内核。
          python3 - <<'PY'
          import sys
          P = 'kernel_platform/common/fs/f2fs/f2fs.h'
          lines = open(P, 'r', encoding='utf-8', newline='').readlines()

          start = next((i for i, l in enumerate(lines)
                        if l.startswith('enum f2fs_lookup_mode')), None)
          if start is None:
              print('::error::找不到 enum f2fs_lookup_mode，树结构已变，停止')
              sys.exit(1)
          end = next((i for i in range(start, len(lines)) if lines[i].rstrip() == '};'), None)
          if end is None:
              print('::error::枚举没有闭合的 };，停止')
              sys.exit(1)
          print('enum 位于第 %d-%d 行' % (start + 1, end + 1))

          out = lines[:end + 1]

          # ① 吃掉紧随其后的孤立 '}'
          j = end + 1
          while j < len(lines) and lines[j].strip() == '':
              j += 1
          if j < len(lines) and lines[j].rstrip() == '}':
              print('删除孤立右花括号：第 %d 行' % (j + 1))
              out.extend(lines[end + 1:j])
              rest = lines[j + 1:]
          else:
              print('未发现孤立右花括号（可能已修过）')
              rest = lines[end + 1:]

          # ② 补 accessor（幂等：已存在就不重复插）
          body = ''.join(lines)
          if 'f2fs_get_lookup_mode(' in body.split('enum f2fs_lookup_mode', 1)[-1].split('};', 1)[-1]:
              print('accessor 已存在，跳过插入')
          else:
              out.append('\n')
              out.append('/* PGW110 build repair: bundle 丢失的 accessor，最小实现 */\n')
              out.append('static inline enum f2fs_lookup_mode\n')
              out.append('f2fs_get_lookup_mode(struct f2fs_sb_info *sbi)\n')
              out.append('{\n')
              out.append('\t(void)sbi;\n')
              out.append('\treturn LOOKUP_AUTO;\n')
              out.append('}\n')
              out.append('\n')
              out.append('static inline void f2fs_set_lookup_mode(struct f2fs_sb_info *sbi,\n')
              out.append('\t\t\t\t\tenum f2fs_lookup_mode mode)\n')
              out.append('{\n')
              out.append('\t(void)sbi;\n')
              out.append('\t(void)mode;\n')
              out.append('}\n')
              print('已插入 f2fs_get_lookup_mode / f2fs_set_lookup_mode')

          open(P, 'w', encoding='utf-8', newline='').write(''.join(out) + ''.join(rest))

          chk = ''.join(open(P, 'r', encoding='utf-8', newline='').readlines())
          print('校验: get=%d 处 set=%d 处'
                % (chk.count('f2fs_get_lookup_mode'), chk.count('f2fs_set_lookup_mode')))
          PY

      - name: Repair half-applied f2fs alloc_mode refactor
        run: |
          # 第二处 f2fs 半途重构（run 42953184387）：
          #   super.c:1022/1024/2110/2112  调 f2fs_set_alloc_mode(sbi, X)
          #   super.c:2030/2032            调 f2fs_get_alloc_mode(sbi)
          #   但全树无此二函数定义；236 官方树同样没有。
          # 铁证：bundle 自己的 super.c:2107 还在用 F2FS_OPTION(sbi).alloc_mode 直接赋值，
          #   紧邻的 2110 却用 wrapper ⇒ 「重构做到一半」，不是设计。
          # 修法＝改回 236 官方树写法（等价改写，不引入新语义）：
          #   f2fs_set_alloc_mode(sbi, X)  ->  F2FS_OPTION(sbi).alloc_mode = X
          #   f2fs_get_alloc_mode(sbi)     ->  F2FS_OPTION(sbi).alloc_mode
          python3 - <<'PY'
          import os, re, sys
          ROOT = 'kernel_platform/common/fs/f2fs'
          set_re = re.compile(r'f2fs_set_alloc_mode\s*\(\s*sbi\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)')
          get_re = re.compile(r'f2fs_get_alloc_mode\s*\(\s*sbi\s*\)')
          tot_s = tot_g = 0
          for dp, dns, fns in os.walk(ROOT):
              for fn in fns:
                  if not fn.endswith(('.c', '.h')):
                      continue
                  p = os.path.join(dp, fn)
                  src = open(p, 'r', encoding='utf-8', newline='').read()
                  if 'alloc_mode(' not in src:
                      continue
                  new, ns = set_re.subn(r'F2FS_OPTION(sbi).alloc_mode = \1', src)
                  new, ng = get_re.subn('F2FS_OPTION(sbi).alloc_mode', new)
                  if ns or ng:
                      open(p, 'w', encoding='utf-8', newline='').write(new)
                      print('  FIX  %s  set=%d get=%d' % (p, ns, ng))
                      tot_s += ns
                      tot_g += ng
          print('共改写 set=%d 处、get=%d 处' % (tot_s, tot_g))
          left = 0
          for dp, dns, fns in os.walk(ROOT):
              for fn in fns:
                  if fn.endswith(('.c', '.h')):
                      s = open(os.path.join(dp, fn), 'r', encoding='utf-8', errors='replace').read()
                      left += len(set_re.findall(s)) + len(get_re.findall(s))
          print('残留 wrapper 调用:', left)
          if left:
              print('::error::仍有 alloc_mode wrapper 未被转换（可能实参不是 sbi），需人工看')
              sys.exit(1)
          PY

      - name: Repair duplicated declaration in f2fs compress.c
        run: |
          # 第四处（run 42954239055）：fs/f2fs/compress.c 里 f2fs_alloc_dic() 的局部变量被写了两遍——
          #   2201  struct f2fs_sb_info *sbi = F2FS_I_SB(cc->inode);
          #   2202-2204  其它局部变量
          #   2205  struct f2fs_sb_info *sbi = F2FS_I_SB(cc->inode);   ← 重复
          #   → error: redefinition of 'sbi'
          # 又一个合并残留。修法：在同一个函数体内，同名同右值的声明只保留第一次出现的。
          python3 - <<'PY'
          import re, sys
          P = 'kernel_platform/common/fs/f2fs/compress.c'
          src = open(P, 'r', encoding='utf-8', newline='').read()
          lines = src.splitlines(True)

          # 定位函数体（大括号配平）
          start = next((i for i, l in enumerate(lines)
                        if 'f2fs_alloc_dic(struct compress_ctx *cc)' in l), None)
          if start is None:
              print('::error::找不到 f2fs_alloc_dic，树结构已变')
              sys.exit(1)
          b = next(i for i in range(start, len(lines)) if lines[i].rstrip() == '{')
          depth = 0
          end = None
          for i in range(b, len(lines)):
              depth += lines[i].count('{') - lines[i].count('}')
              if depth == 0 and i > b:
                  end = i
                  break
          if end is None:
              print('::error::函数体大括号不配平')
              sys.exit(1)
          print('f2fs_alloc_dic 位于第 %d-%d 行' % (start + 1, end + 1))

          seen = set()
          drop = []
          pat = re.compile(r'^\s*struct\s+f2fs_sb_info\s*\*\s*(\w+)\s*=\s*(.+?);\s*$')
          for i in range(b, end + 1):
              m = pat.match(lines[i])
              if not m:
                  continue
              key = (m.group(1), m.group(2).strip())
              if key in seen:
                  drop.append(i)
              else:
                  seen.add(key)
          if not drop:
              print('未发现重复声明（可能已修过）')
          else:
              for i in reversed(drop):
                  print('  删除第 %d 行重复声明: %s' % (i + 1, lines[i].strip()))
                  del lines[i]
              open(P, 'w', encoding='utf-8', newline='').write(''.join(lines))
              print('已删除 %d 行' % len(drop))

          # 校验：只看这个函数体内是否还有重复（同名变量在别的函数里合法存在，不能全局统计）
          lines2 = open(P, 'r', encoding='utf-8', newline='').readlines()
          s2 = next(i for i, l in enumerate(lines2)
                    if 'f2fs_alloc_dic(struct compress_ctx *cc)' in l)
          b2 = next(i for i in range(s2, len(lines2)) if lines2[i].rstrip() == '{')
          d2 = 0
          e2 = None
          for i in range(b2, len(lines2)):
              d2 += lines2[i].count('{') - lines2[i].count('}')
              if d2 == 0 and i > b2:
                  e2 = i
                  break
          keys = []
          for i in range(b2, e2 + 1):
              m = pat.match(lines2[i])
              if m:
                  keys.append((m.group(1), m.group(2).strip()))
          dup = len(keys) - len(set(keys))
          print('校验：函数体内声明 %d 条，重复 %d 条' % (len(keys), dup))
          if dup:
              print('::error::函数体内仍有重复声明')
              sys.exit(1)
          PY

      - name: Restore missing f2fs lz4armv8 sources
        run: |
          # 第五处（run 42954825064）：不是改坏，是**缺文件**——
          #   fs/f2fs/Makefile:13  f2fs-$(CONFIG_ARM64) += $(addprefix lz4armv8/, lz4accel.o lz4armv8.o)
          #   但 bundle 的 fs/f2fs/lz4armv8/ 只有 lz4accel.c，
          #   缺 lz4accel.h(1433B) 与 lz4armv8.S(7790B)
          #   → make[3]: No rule to make target 'fs/f2fs/lz4armv8/lz4armv8.o'
          # 依据：bundle 的 lz4accel.c 与 oppo-source 官方树同为 1533 B，同源同版本，
          #       故从官方 236 树补齐缺失两件是安全的。
          set -e
          D=kernel_platform/common/fs/f2fs/lz4armv8
          BASE='https://raw.githubusercontent.com/oppo-source/android_kernel_common_oppo_sm8475/oppo/sm8475_b_16.0_reno9_pro_plus/fs/f2fs/lz4armv8'
          echo "=== 补齐前 ==="
          ls -l "$D" || true
          for f in lz4accel.h lz4armv8.S; do
            if [ -s "$D/$f" ]; then
              echo "  已存在，跳过 $f"
            else
              echo "  下载 $f"
              curl -fsSL --retry 3 "$BASE/$f" -o "$D/$f"
            fi
          done
          echo "=== 补齐后 ==="
          ls -l "$D"
          for f in lz4accel.c lz4accel.h lz4armv8.S; do
            if [ -s "$D/$f" ]; then
              echo "  OK   $f  $(stat -c%s "$D/$f") B"
            else
              echo "::error::仍缺 $f"
              exit 1
            fi
          done

          # 预检（只报告不阻断）：把 fs/f2fs/Makefile 引用的对象对一遍源文件，
          # 一次性列全缺件，免得一轮只暴露一个、每轮烧 12 分钟。
          python3 - <<'PY'
          import os, re
          P = 'kernel_platform/common/fs/f2fs'
          mk = open(os.path.join(P, 'Makefile'), encoding='utf-8').read()
          # 展开 $(addprefix dir/, a.o b.o)
          mk = re.sub(r'\$\(addprefix\s+([^,]+),\s*([^)]+)\)',
                      lambda m: ' '.join(m.group(1).strip() + x
                                         for x in m.group(2).split()), mk)
          # 复合对象（f2fs-y := / f2fs-$(CONFIG_xxx) += 等）没有同名源文件，要排除
          comp = set(re.findall(r'^(\w+)-[^=\s]*\s*\+?=', mk, re.M))
          objs = set(re.findall(r'[\w./-]+\.o\b', mk))
          missing = []
          for o in sorted(objs):
              base = o[:-2]
              if base in comp:
                  continue
              if any(os.path.exists(os.path.join(P, base + e)) for e in ('.c', '.S', '.s')):
                  continue
              missing.append(o)
          print('f2fs/Makefile 引用对象 %d 个，缺源文件 %d 个' % (len(objs), len(missing)))
          for o in missing:
              print('  MISS %s' % o)
          if not missing:
              print('  无缺件')
          PY

      - name: Apply hmbird patch (OGKI to GKI)
        working-directory: ${{ github.workspace }}/kernel_platform/common
        run: |
          sed -i '1i obj-y += hmbird_patch.o' drivers/Makefile
          patch -p1 -F 3 < "${GITHUB_WORKSPACE}/Patches/hmbird_patch.patch"
          ls -la drivers/hmbird_patch.c

      - name: Patch defconfig
        working-directory: ${{ github.workspace }}/kernel_platform/common
        run: |
          CFG=arch/arm64/configs/gki_defconfig
          LV="${{ github.event.inputs.KERNEL_SUFFIX }}"
          if [ -z "$LV" ]; then LV="-android12-9-o-g-pgw110-270"; fi
          cat >> "$CFG" <<EOF

          # ===== PGW110 移植：热点所需 netfilter =====
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_HL=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF
          echo "LOCALVERSION 将由 make 传入：$LV"
          tail -11 "$CFG"

      - name: Configure and verify
        working-directory: ${{ github.workspace }}/kernel_platform/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig

          S=scripts/config
          chmod +x "$S"
          "$S" --file out/.config --disable TRIM_UNUSED_KSYMS
          "$S" --file out/.config --set-str UNUSED_KSYMS_WHITELIST ""
          "$S" --file out/.config --disable LTO_CLANG_FULL
          "$S" --file out/.config --enable LTO_CLANG_THIN
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== 关键配置校验 ==="
          fail=0
          for k in CONFIG_IP_SET CONFIG_NETFILTER_XT_SET \
                   CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NETFILTER_XT_TARGET_HL \
                   CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE; do
            if grep -qx "${k}=y" out/.config; then echo "  OK   $k"; else echo "  MISS $k"; fail=1; fi
          done
          echo "=== 版本/LTO/裁剪 ==="
          grep -E '^CONFIG_LTO_|^# CONFIG_LTO_|CONFIG_TRIM_UNUSED_KSYMS' out/.config
          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION="$LV" kernelrelease
          if [ "$fail" != "0" ]; then echo "::error::关键配置缺失"; exit 1; fi
          ccache -z || true

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel_platform/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          # ⚠️ 目标必须显式写 Image。
          #     默认目标 all: 含 dtbs，会把 arch/arm64/boot/dts/ 下所有厂商板卡
          #     （allwinner/rockchip/...）全编一遍，本树缺 dt-bindings 头文件，必然失败。
          #     GKI 不需要 DTB，PGW110 也只用 vendor_boot 里的 DTB。
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error LOCALVERSION="$LV" \
               Image
          ls -la out/arch/arm64/boot/
          echo "=== kernel.release ==="
          cat out/include/config/kernel.release
          echo
          ccache -s || true

      - name: Module feasibility probe (non-blocking)
        if: ${{ github.event.inputs.PROBE_MODULES != 'false' }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}/kernel_platform/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          # 只探测、不阻断。目的是拿到「OPPO 236 模块源码能否在 270 common 上编译」的真实数据。
          set +e
          OUT="${GITHUB_WORKSPACE}/probe_mod.txt"
          : > "$OUT"
          echo "=== modules_prepare ===" | tee -a "$OUT"
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
               LOCALVERSION="$LV" modules_prepare 2>&1 | tee -a "$OUT" | tail -30
          echo "modules_prepare RC=${PIPESTATUS[0]}" | tee -a "$OUT"

          for M in vendor/oplus/kernel/touchpanel \
                   vendor/oplus/kernel/audio \
                   vendor/oplus/kernel/storage; do
            D="${GITHUB_WORKSPACE}/${M}"
            echo "" | tee -a "$OUT"
            echo "===== ${M} =====" | tee -a "$OUT"
            if [ ! -d "$D" ]; then echo "  MISS 目录不存在" | tee -a "$OUT"; continue; fi
            # tee 落盘 + tail 只看本次输出的尾部（不要 tail 整个累积文件）
            make -j4 -C "${GITHUB_WORKSPACE}/kernel_platform/common" O=out \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- \
                 KCFLAGS=-Wno-error LOCALVERSION="$LV" M="$D" modules \
                 2>&1 | tee -a "$OUT" | tail -40
            echo "RC=${PIPESTATUS[0]}" | tee -a "$OUT"
          done

          echo "" | tee -a "$OUT"
          echo "=== 编出的 .ko 数量 ===" | tee -a "$OUT"
          find "${GITHUB_WORKSPACE}/vendor" -name '*.ko' 2>/dev/null | wc -l | tee -a "$OUT"
          echo "（对比：设备 /vendor_dlkm 里是 377 个 5.10.236 的 .ko）" | tee -a "$OUT"

      - name: Package
        run: |
          set -e
          mkdir -p dist
          IMG=$(find kernel_platform/common/out/arch/arm64/boot -maxdepth 1 -name 'Image' | head -1)
          test -n "$IMG"
          cp "$IMG" dist/Image
          cp kernel_platform/common/out/.config dist/kernel.config
          cat kernel_platform/common/out/include/config/kernel.release > dist/KERNEL_RELEASE.txt
          # Module.symvers 是离线核对符号 CRC 的唯一硬证据：设备 .ko 里的 __crc_* 
          # 与它逐条比对，才能判断「能不能配现有模块一起用」。
          cp kernel_platform/common/out/Module.symvers dist/Module.symvers 2>/dev/null \
            || echo "WARN: Module.symvers 不存在"
          [ -f probe_mod.txt ] && cp probe_mod.txt dist/modules_probe.txt || true
          ls -la dist
          sha256sum dist/Image

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGW110-kernel-5.10.270-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
