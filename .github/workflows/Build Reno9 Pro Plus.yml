name: Build Reno9 Pro Plus

# 重写版（2026-11-10，第 2 版）
#
# 原版由 TNTyep520 于 2025-07-15 提交后再未跑通，硬伤：
#   1. inputs 缩进错误（KSU_META 与 inputs 同级）→ 传参 422
#   2. 源码 clone 到 kernel_workspace/common，下一步却 `cd common`
#   3. 多出无配对 fi、for 循环缺 do、cp 路径多退一级
#   4. 从未下载 clang（引用 prebuilts-master 但没任何步骤拉取）
#
# 第 2 版修正（run #5 暴露的真因）：
#   `init/Kconfig:857: can't open file "kernel/oplus_cpu/sched/Kconfig"`
#   该路径是符号链接，指向 ../../../vendor/oplus/kernel/cpu —— OPPO 把源码
#   拆成两个仓库发布，common 树本身不完整。正确布局：
#     <ws>/kernel_platform/common    ← android_kernel_common_oppo_sm8475
#     <ws>/kernel_platform/{build,oplus,qcom}
#     <ws>/vendor/...                ← android_kernel_modules_and_devicetree_oppo_sm8475
#   三个外链：kernel/oplus_cpu → vendor/oplus/kernel/cpu
#             drivers/soc/oplus/storage → vendor/oplus/kernel/storage
#             android/abi_gki_aarch64_oplus_internal → kernel_platform/oplus/config/...

on:
  workflow_dispatch:
    inputs:
      ENABLE_KSU:
        description: '集成 KernelSU（官方 tiann）。注意：设备 stock 内核配置里没有 CONFIG_KSU，说明现用 root 是 KernelSU 的 LKM 模式，默认不集成（保持 vermagic 一致即可复用现有 ksu.ko）'
        type: boolean
        default: false
      KERNEL_SUFFIX:
        description: 'LOCALVERSION 后缀（留空 = 对齐 stock 的 -android12-9-o-gdf413c13de93）'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      KERNEL_REPO: 'https://github.com/oppo-source/android_kernel_common_oppo_sm8475'
      MODULES_REPO: 'https://github.com/oppo-source/android_kernel_modules_and_devicetree_oppo_sm8475'
      KERNEL_BRANCH: 'oppo/sm8475_b_16.0_reno9_pro_plus'
      CLANG_REPO: 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b'
      CLANG_BRANCH: 'lineage-20.0'
      CLANG_DIR: '/home/runner/clang-r416183b'
      CCACHE_DIR: '/home/runner/.ccache_pgw110'
      CCACHE_MAXSIZE: '6G'
      CCACHE_COMPILERCHECK: 'content'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_BASEDIR: '/home/runner/work'

    steps:
      - name: Checkout (Patches/)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            python3 git curl wget ccache rsync unzip zip cpio kmod \
            zlib1g-dev libxml2-utils dwarves lz4 device-tree-compiler
          echo "--- 工具版本 ---"
          gcc --version | head -1
          python3 --version
          (pahole --version || echo "pahole 缺失（BTF 可能失败）")

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-pgw110-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pgw110-

      - name: Fetch clang r416183b
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" "$CLANG_DIR"
          "$CLANG_DIR/bin/clang" --version
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"

      - name: Fetch kernel source (common + modules)
        run: |
          set -e
          rm -rf common kernel_platform vendor modsrc
          mkdir -p kernel_platform

          # ① GKI common 树
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_platform/common
          echo "common HEAD: $(git -C kernel_platform/common rev-parse --short HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' kernel_platform/common/Makefile

          # ② OPPO 私有模块 + 设备树（提供 vendor/oplus 与 kernel_platform 的补充件）
          git clone --depth=1 -b "$KERNEL_BRANCH" "$MODULES_REPO" modsrc
          echo "modules HEAD: $(git -C modsrc rev-parse --short HEAD)"

          # ③ 拼成 OPPO 原始仓库布局
          for d in build oplus qcom; do
            if [ -d "modsrc/kernel_platform/$d" ]; then
              rm -rf "kernel_platform/$d"
              mv "modsrc/kernel_platform/$d" "kernel_platform/$d"
            fi
          done
          mv modsrc/vendor ./vendor
          rm -rf modsrc

          # 版本串去掉 -dirty / 随机后缀，交给 CONFIG_LOCALVERSION
          printf '#!/bin/sh\nexit 0\n' > kernel_platform/common/scripts/setlocalversion
          chmod +x kernel_platform/common/scripts/setlocalversion
          sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki || true

      - name: Verify tree layout (symlinks resolve)
        run: |
          set -e
          K=kernel_platform/common
          echo "=== 三个外链目标 ==="
          for p in "$K/kernel/oplus_cpu/sched" "$K/drivers/soc/oplus/storage" \
                   "kernel_platform/oplus/config"; do
            if [ -e "$p" ]; then echo "  OK   $p"; else echo "  MISS $p"; exit 1; fi
          done
          echo "=== 关键 Kconfig 可读 ==="
          test -r "$K/kernel/oplus_cpu/sched/Kconfig" && echo "  OK   oplus_cpu/sched/Kconfig"
          echo "=== 断链检查（仅记录，不阻断）==="
          broken=$(find "$K/kernel" "$K/drivers/soc" -xtype l 2>/dev/null || true)
          if [ -n "$broken" ]; then echo "$broken" | head -20; else echo "  无断链"; fi
          echo "=== vendor/oplus/kernel ==="
          ls vendor/oplus/kernel | head -30

      - name: Apply hmbird patch (OGKI to GKI)
        working-directory: ${{ github.workspace }}/kernel_platform/common
        run: |
          sed -i '1i obj-y += hmbird_patch.o' drivers/Makefile
          patch -p1 -F 3 < "${GITHUB_WORKSPACE}/Patches/hmbird_patch.patch"
          grep -n "hmbird_patch" drivers/Makefile
          ls -la drivers/hmbird_patch.c

      - name: Add KernelSU
        if: ${{ github.event.inputs.ENABLE_KSU == 'true' }}
        working-directory: ${{ github.workspace }}/kernel_platform/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "--- 安装结果 ---"
          ls -la KernelSU | head -5
          ls -la drivers/kernelsu
          grep -n "KSU" drivers/Makefile
          grep -n "kernelsu" drivers/Kconfig

      - name: Seed config from device stock
        working-directory: ${{ github.workspace }}/kernel_platform/common
        run: |
          mkdir -p out
          cp "${GITHUB_WORKSPACE}/Patches/pgw110_stock.config" out/.config
          S="scripts/config"
          chmod +x "$S"

          # 版本串对齐 stock。stock 是 LOCALVERSION_AUTO=y + git describe 得到
          # 5.10.236-android12-9-o-gdf413c13de93；这里改成固定串并关掉 AUTO，
          # 保证 vermagic 与 vendor_dlkm 里 377 个预编译 .ko 完全一致。
          LV="${{ github.event.inputs.KERNEL_SUFFIX }}"
          if [ -z "$LV" ]; then LV="-android12-9-o-gdf413c13de93"; fi
          "$S" --file out/.config --set-str LOCALVERSION "$LV"
          "$S" --file out/.config --disable LOCALVERSION_AUTO
          echo "LOCALVERSION = $LV ；LOCALVERSION_AUTO 已关闭"

          # 6 项 netfilter：IP_SET 是 XT_SET 的依赖，IP6_NF_NAT 是 IP6 MASQUERADE 的依赖
          for k in IP_SET NETFILTER_XT_SET NETFILTER_XT_MATCH_ADDRTYPE \
                   NETFILTER_XT_TARGET_HL IP6_NF_NAT IP6_NF_TARGET_MASQUERADE; do
            "$S" --file out/.config --enable "$k"
          done

          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            "$S" --file out/.config --enable KSU
          fi
          echo "已写入，等待 olddefconfig 解析依赖"

      - name: Configure (stock config + olddefconfig) and verify
        working-directory: ${{ github.workspace }}/kernel_platform/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== 关键配置校验 ==="
          fail=0
          for k in CONFIG_IP_SET CONFIG_NETFILTER_XT_SET \
                   CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NETFILTER_XT_TARGET_HL \
                   CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE; do
            if grep -qx "${k}=y" out/.config; then
              echo "  OK   $k"
            else
              echo "  MISS $k"
              grep -E "^# ${k} is not set|^${k}=" out/.config || echo "        (.config 里完全没有这一项)"
              fail=1
            fi
          done
          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            grep -qx "CONFIG_KSU=y" out/.config && echo "  OK   CONFIG_KSU" || { echo "  MISS CONFIG_KSU"; fail=1; }
          fi

          echo "=== 版本串 ==="
          grep -E '^CONFIG_LOCALVERSION=|^# CONFIG_LOCALVERSION_AUTO' out/.config
          echo "期望 kernel.release = 5.10.236$(grep '^CONFIG_LOCALVERSION=' out/.config | sed 's/^CONFIG_LOCALVERSION="\(.*\)"/\1/')"

          echo "=== 与 stock 的配置差异（模块兼容性关键指标）==="
          python3 - "${GITHUB_WORKSPACE}/Patches/pgw110_stock.config" <<'PYEOF'
          import re, sys
          def load(p):
              d={}
              for line in open(p, encoding='utf-8', errors='replace'):
                  line=line.strip()
                  m=re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', line)
                  if m: d[m.group(1)]=m.group(2); continue
                  m=re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$', line)
                  if m: d[m.group(1)]='n'
              return d
          a=load(sys.argv[1])
          b=load('out/.config')
          added=[k for k in b if k not in a]
          dropped=[k for k in a if k not in b]
          changed=[k for k in a if k in b and a[k]!=b[k]]
          print('stock 项数 %d / 本次 %d' % (len(a), len(b)))
          print('新增 %d 项；被 olddefconfig 丢弃 %d 项；值改变 %d 项' % (len(added), len(dropped), len(changed)))
          print('--- 被丢弃（前 40，说明本树缺少对应 Kconfig）---')
          for k in dropped[:40]: print('  -', k)
          print('--- 值改变（前 40）---')
          for k in changed[:40]: print('  ~ %s: %s -> %s' % (k, a[k], b[k]))
          PYEOF

          if [ "$fail" != "0" ]; then
            echo "::error::关键配置有缺失，终止构建（省一小时）"
            exit 1
          fi
          ccache -z || true

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel_platform/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/
          echo "=== kernel.release ==="
          cat out/include/config/kernel.release
          echo
          echo "=== vermagic 相关 ==="
          grep -E '^CONFIG_(MODVERSIONS|LOCALVERSION)' out/.config
          ccache -s || true

      - name: Package (Image + AnyKernel3)
        run: |
          set -e
          mkdir -p dist
          IMG=$(find kernel_platform/common/out/arch/arm64/boot -maxdepth 1 -name 'Image' | head -1)
          test -n "$IMG"
          cp "$IMG" dist/Image
          cp kernel_platform/common/out/.config dist/kernel.config
          cat kernel_platform/common/out/include/config/kernel.release > dist/KERNEL_RELEASE.txt
          ls -la dist
          sha256sum dist/Image

          git clone --depth=1 https://github.com/Numbersf/AnyKernel3 anykernel
          rm -rf anykernel/.git
          cp dist/Image anykernel/Image
          cd anykernel
          zip -r9 ../dist/AnyKernel3.zip . -x '*.git*' > /dev/null
          cd ..
          ls -la dist
          sha256sum dist/AnyKernel3.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGW110-kernel-5.10.236-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### PGW110 内核构建结果"
            echo ""
            echo "- 源码分支：\`$KERNEL_BRANCH\`"
            echo "- 内核版本：\`$(cat dist/KERNEL_RELEASE.txt)\`"
            echo "- Image 大小：$(stat -c%s dist/Image) B"
            echo "- KernelSU：${{ github.event.inputs.ENABLE_KSU }}"
            echo ""
            echo "产物：\`Image\`、\`AnyKernel3.zip\`、\`kernel.config\`"
          } >> $GITHUB_STEP_SUMMARY
