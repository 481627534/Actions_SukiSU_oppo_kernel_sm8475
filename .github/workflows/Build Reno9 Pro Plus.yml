name: Build Reno9 Pro Plus

# 重写版（2026-11-10）
# 原版由 TNTyep520 于 2025-07-15 提交后再未跑通，存在以下硬伤：
#   1. inputs 缩进错误（KSU_META 与 inputs 同级）→ 无法传参
#   2. "Pull Kernel Open Source" 把源码 clone 到 kernel_workspace/common，
#      但下一步写的是 `cd common` → 必然 No such file or directory
#   3. 多出无配对的 fi、for 循环缺 do、cp 路径多退一级
#   4. 从未下载 clang（引用 prebuilts-master 但没有任何步骤拉取）
# 本版：全流程自洽（源码固定在 $GITHUB_WORKSPACE/common），clang 取自
# LineageOS 的 r416183b 预编译（与 OPPO build.config.gki.aarch64 的 CLANG_VERSION 一致），
# defconfig 后立即校验关键项是否生效，避免白等一小时。

on:
  workflow_dispatch:
    inputs:
      ENABLE_KSU:
        description: '集成 KernelSU（官方 tiann）'
        type: boolean
        default: true
      KERNEL_SUFFIX:
        description: 'LOCALVERSION 后缀（留空 = 对齐 stock 的 -android12-9-o-gdf413c13de93）'
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      KERNEL_REPO: 'https://github.com/oppo-source/android_kernel_common_oppo_sm8475'
      KERNEL_BRANCH: 'oppo/sm8475_b_16.0_reno9_pro_plus'
      CLANG_REPO: 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b'
      CLANG_BRANCH: 'lineage-20.0'
      CLANG_DIR: '/home/runner/clang-r416183b'
      CCACHE_DIR: '/home/runner/.ccache_pgw110'
      CCACHE_MAXSIZE: '6G'
      CCACHE_COMPILERCHECK: 'content'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_BASEDIR: '/home/runner/work'

    steps:
      - name: Checkout (Patches/)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            python3 git curl wget ccache rsync unzip zip cpio kmod \
            zlib1g-dev libxml2-utils dwarves lz4 device-tree-compiler
          echo "--- 工具版本 ---"
          gcc --version | head -1
          python3 --version
          (pahole --version || echo "pahole 缺失（BTF 可能失败）")

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-pgw110-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pgw110-

      - name: Fetch clang r416183b
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" "$CLANG_DIR"
          "$CLANG_DIR/bin/clang" --version
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$CLANG_DIR/bin/llvm-ar"

      - name: Fetch kernel source
        run: |
          rm -rf common
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" common
          echo "HEAD: $(git -C common rev-parse --short HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile
          # 版本串不带 -dirty / 随机后缀：setlocalversion 输出置空，
          # 由 CONFIG_LOCALVERSION 全权决定 kernel.release
          printf '#!/bin/sh\nexit 0\n' > common/scripts/setlocalversion
          chmod +x common/scripts/setlocalversion
          sed -i 's/check_defconfig//' common/build.config.gki || true

      - name: Apply hmbird patch (OGKI to GKI)
        working-directory: ${{ github.workspace }}/common
        run: |
          sed -i '1i obj-y += hmbird_patch.o' drivers/Makefile
          patch -p1 -F 3 < "${GITHUB_WORKSPACE}/Patches/hmbird_patch.patch"
          grep -n "hmbird_patch" drivers/Makefile
          ls -la drivers/hmbird_patch.c

      - name: Add KernelSU
        if: ${{ github.event.inputs.ENABLE_KSU == 'true' }}
        working-directory: ${{ github.workspace }}/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "--- 安装结果 ---"
          ls -la KernelSU | head -5
          ls -la drivers/kernelsu
          grep -n "KSU" drivers/Makefile
          grep -n "kernelsu" drivers/Kconfig

      - name: Patch defconfig
        working-directory: ${{ github.workspace }}/common
        run: |
          CFG=arch/arm64/configs/gki_defconfig
          cat >> "$CFG" <<'EOF'

          # ===== PGW110 移植：补齐热点（tethering）所需 netfilter =====
          # 本机 stock 内核：ADDRTYPE / TARGET_HL / XT_SET / IP6_NF_NAT 均为 not set
          # IP_SET 是 XT_SET 的 Kconfig 依赖，IP6_NF_NAT 是 IP6 MASQUERADE 的依赖
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_HL=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            echo "CONFIG_KSU=y" >> "$CFG"
          fi

          # 内核版本串：默认对齐 stock，保证 vendor 侧 .ko 的 vermagic 一致
          LV="${{ github.event.inputs.KERNEL_SUFFIX }}"
          if [ -z "$LV" ]; then
            LV="-android12-9-o-gdf413c13de93"
          fi
          echo "CONFIG_LOCALVERSION=\"$LV\"" >> "$CFG"
          echo "LOCALVERSION 将设为: $LV"
          echo "--- 追加的配置 ---"
          tail -15 "$CFG"

      - name: Configure (gki_defconfig) and verify
        working-directory: ${{ github.workspace }}/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          echo "=== 关键配置校验 ==="
          fail=0
          for k in CONFIG_IP_SET CONFIG_NETFILTER_XT_SET \
                   CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NETFILTER_XT_TARGET_HL \
                   CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE; do
            if grep -qx "${k}=y" out/.config; then
              echo "  OK   $k"
            else
              echo "  MISS $k"
              grep -E "^# ${k} is not set|^${k}=" out/.config || echo "        (.config 里完全没有这一项)"
              fail=1
            fi
          done
          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            grep -qx "CONFIG_KSU=y" out/.config && echo "  OK   CONFIG_KSU" || { echo "  MISS CONFIG_KSU"; fail=1; }
          fi
          echo "=== 版本串 ==="
          grep -E '^CONFIG_LOCALVERSION=' out/.config
          if [ "$fail" != "0" ]; then
            echo "::error::关键配置有缺失，终止构建（省一小时）"
            exit 1
          fi
          ccache -z || true

      - name: Build kernel
        working-directory: ${{ github.workspace }}/common
        env:
          PATH: /home/runner/clang-r416183b/bin:/usr/lib/ccache:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/
          echo "=== kernel.release ==="
          cat out/include/config/kernel.release
          echo
          ccache -s || true

      - name: Package (Image + AnyKernel3)
        run: |
          set -e
          mkdir -p dist
          IMG=$(find common/out/arch/arm64/boot -maxdepth 1 -name 'Image' | head -1)
          test -n "$IMG"
          cp "$IMG" dist/Image
          cp common/out/.config dist/kernel.config
          cat common/out/include/config/kernel.release > dist/KERNEL_RELEASE.txt
          ls -la dist
          sha256sum dist/Image

          git clone --depth=1 https://github.com/Numbersf/AnyKernel3 anykernel
          rm -rf anykernel/.git
          cp dist/Image anykernel/Image
          cd anykernel
          zip -r9 ../dist/AnyKernel3.zip . -x '*.git*' > /dev/null
          cd ..
          ls -la dist
          sha256sum dist/AnyKernel3.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGW110-kernel-5.10.236-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### PGW110 内核构建结果"
            echo ""
            echo "- 源码分支：\`$KERNEL_BRANCH\`"
            echo "- 内核版本：\`$(cat dist/KERNEL_RELEASE.txt)\`"
            echo "- Image 大小：$(stat -c%s dist/Image) B"
            echo "- KernelSU：${{ github.event.inputs.ENABLE_KSU }}"
            echo ""
            echo "产物：\`Image\`、\`AnyKernel3.zip\`、\`kernel.config\`"
          } >> $GITHUB_STEP_SUMMARY
